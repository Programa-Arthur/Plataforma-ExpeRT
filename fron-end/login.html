<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Plataforma ExpeRT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="lindo.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="login-page">

  <header class="site-header">
    <div id="logo-container">
      <a href="index.html" class="logo-link">
        <img class="brand-image" src="imagens/logo.png" alt="ExpeRT Plataforma">
      </a>
    </div>

    <nav id="header-buttons">
      <a href="index.html" class="btn-header">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>
      <button class="btn-header theme-toggle" id="themeToggle" type="button" aria-label="Ativar tema escuro" title="Alternar tema">
        <i class="bi bi-moon-stars-fill" id="themeIcon" aria-hidden="true"></i>
      </button>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="bi bi-shield-lock-fill login-icon"></i>
        <h2 id="loginTitle">Acesso à Plataforma</h2>
        <p id="loginSubtitle">Digite as suas credenciais para continuar</p>
      </div>

      <!-- Div para exibir mensagens de erro do Banco de Dados -->
      <div id="mensagemErro" style="display:none; color: #ff4757; text-align: center; margin-bottom: 1rem; font-weight: 600;"></div>

      <form id="loginForm">
        <div class="form-group" id="nameGroup" hidden>
          <label for="name">Nome</label>
          <div class="input-wrapper">
            <i class="bi bi-person"></i>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Seu nome completo">
          </div>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" name="email" autocomplete="username" placeholder="seu.email@ifc.edu.br" required>
          </div>
        </div>

        <div class="form-group">
          <label for="userType">Você é</label>
          <div class="input-wrapper">
            <i class="bi bi-people"></i>
            <select id="userType" name="type" required>
              <option value="discente">Discente</option>
              <option value="docente">Docente</option>
              <option value="outro">Outro</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="confirmPasswordGroup" hidden>
          <label for="confirmPassword">Confirmar senha</label>
          <div class="input-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="••••••••">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember"> Lembrar-me
          </label>
          <a href="#" class="forgot-password" id="forgotPassword">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-animado btn-login-submit" id="btnSubmit">Entrar</button>
      </form>

      <div class="login-footer">
        <p id="authToggleText">Não tem conta? <a href="#" id="authToggle">Criar conta</a>.</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Plataforma ExpeRT — Instituto Federal Catarinense (Campus Sombrio)</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- CONTROLE DE TEMA ---
      const themeToggleBtn = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const htmlElement = document.documentElement;

      function applyTheme(theme) {
        htmlElement.setAttribute('data-theme', theme);
        themeIcon.className = theme === 'dark' ? 'bi bi-brightness-high-fill' : 'bi bi-moon-stars-fill';
        themeToggleBtn.setAttribute('aria-label', theme === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro');
      }

      try {
        const savedTheme = localStorage.getItem('expert_theme') || 'light';
        applyTheme(savedTheme);
        themeToggleBtn.addEventListener('click', () => {
          const currentTheme = htmlElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          applyTheme(newTheme);
          localStorage.setItem('expert_theme', newTheme);
        });
      } catch (error) {
        applyTheme('light');
      }

      // --- CONEXÃO COM A API NODE/MONGODB ---
      const loginForm = document.getElementById('loginForm');
      const mensagemErro = document.getElementById('mensagemErro');
      const botaoSubmit = document.getElementById('btnSubmit');
      const nameGroup = document.getElementById('nameGroup');
      const nameInput = document.getElementById('name');
      const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordInput = document.getElementById('password');
      const authToggle = document.getElementById('authToggle');
      const authToggleText = document.getElementById('authToggleText');
      const forgotPassword = document.getElementById('forgotPassword');
      let isRegistering = false;

      function showMessage(message, isError = true) {
        mensagemErro.innerText = message;
        mensagemErro.style.color = isError ? '#ff4757' : '#16803c';
        mensagemErro.style.display = 'block';
      }

      function updateAuthMode() {
        nameGroup.hidden = !isRegistering;
        confirmPasswordGroup.hidden = !isRegistering;
        nameInput.required = isRegistering;
        confirmPasswordInput.required = isRegistering;
        passwordInput.autocomplete = isRegistering ? 'new-password' : 'current-password';
        document.getElementById('loginTitle').innerText = isRegistering ? 'Criar conta' : 'Acesso à Plataforma';
        document.getElementById('loginSubtitle').innerText = isRegistering
          ? 'Preencha os dados para criar seu acesso'
          : 'Digite as suas credenciais para continuar';
        botaoSubmit.innerText = isRegistering ? 'Criar conta' : 'Entrar';
        forgotPassword.hidden = isRegistering;
        authToggleText.innerHTML = isRegistering
          ? 'Já tem conta? <a href="#" id="authToggle">Entrar</a>.'
          : 'Não tem conta? <a href="#" id="authToggle">Criar conta</a>.';
        document.getElementById('authToggle').addEventListener('click', toggleAuthMode);
      }

      function toggleAuthMode(event) {
        event.preventDefault();
        isRegistering = !isRegistering;
        mensagemErro.style.display = 'none';
        updateAuthMode();
      }

      authToggle.addEventListener('click', toggleAuthMode);

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede o recarregamento da página
        mensagemErro.style.display = 'none';
        botaoSubmit.disabled = true;

        const email = document.getElementById('email').value;
        const password = passwordInput.value;
        const name = nameInput.value;
        const type = document.getElementById('userType').value;

        if (isRegistering && password !== confirmPasswordInput.value) {
          showMessage('As senhas não são iguais.');
          botaoSubmit.disabled = false;
          return;
        }

        try {
          const response = await fetch(isRegistering ? '/api/register' : '/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(isRegistering ? { name, email, password, type } : { email, password, type })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.mensagem || 'Não foi possível entrar. Tente novamente.');
          }

          if (data.sucesso && isRegistering) {
            isRegistering = false;
            loginForm.reset();
            updateAuthMode();
            showMessage(data.mensagem, false);
          } else if (data.sucesso) {
            // A sessão autenticada também é validada pelo servidor via cookie HttpOnly.
            localStorage.setItem('usuario_logado', JSON.stringify(data.usuario));
            const requestedPage = new URLSearchParams(window.location.search).get('redirect');
            window.location.href = requestedPage === 'tutorial.html' ? 'tutorial.html' : 'index.html';
          } else {
            // Exibe mensagem de erro retornada pela API
            showMessage(data.mensagem);
          }
        } catch (error) {
          showMessage(error.message || 'Erro ao conectar ao servidor. Tente novamente.');
        } finally {
          botaoSubmit.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
